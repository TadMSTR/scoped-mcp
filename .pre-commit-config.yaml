repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Kept inside pyproject.toml's `ruff>=0.15,<0.16` bound. These two pins are the same tool
    # run at two moments, and when they disagree the pre-commit hook passes code that CI then
    # rejects — which trains people to skip the hook. This was at v0.11.6 against a CI ruff of
    # 0.15.x until 2026-09-08; four minor versions of rule drift apart.
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
