# Backstop for a public repo. The rules that matter here are not the generic token patterns
# gitleaks already ships — they are the deployment-specific values that look harmless in a diff.
# A real room ID or internal hostname committed once stays in the history until someone runs
# filter-repo.
#
# TUNED TO THIS REPO, NOT INHERITED. This file started as a copy of webhook-doorman's and was
# then measured against scoped-mcp's actual corpus. Every one of that repo's five allowlisted
# fixture values (`test-github-...`, `abcdefgh12345678`, `s3cret-value`, `10.9.0.x`, `10.9.1.x`)
# occurs zero times here, and carrying them across would have shipped five suppressions with no
# corresponding finding — a file that looks tuned while suppressing nothing that exists. They
# are removed. The entries below were each derived from a real hit on this tree.
#
# The scan that produced them also found something real: `192.168.1.11`, an operator
# workstation's actual LAN address, in three test fixtures. Those are now `192.0.2.11`
# (TEST-NET-1). That is what this file is for.

[extend]
useDefault = true

[[rules]]
id = "matrix-room-id"
description = "Matrix room ID (deployment topology)"
regex = '''![A-Za-z0-9]{16,}:[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
tags = ["topology"]

[[rules]]
id = "matrix-access-token"
description = "Matrix access token"
regex = '''(?i)syt_[A-Za-z0-9_-]{20,}'''
tags = ["secret"]

[[rules]]
id = "private-ipv4-literal"
description = "RFC1918 address outside documentation ranges"
# No lookahead: gitleaks uses Go's RE2, which does not support (?!...). Exclusions live in
# the allowlist below instead.
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b'''
tags = ["topology"]

[allowlist]
description = "Documentation ranges, loopback, and the SSRF blocklist's own boundaries"
# Allowlisted by VALUE, not by path. Allowlisting tests/ wholesale would hide a real credential
# pasted into a fixture — which is the most likely way one reaches this repo.
#
# The RFC1918 literals below are not topology. http_proxy.py enumerates the address ranges it
# REFUSES to proxy to (_BLOCKED_IP_NETWORKS), and its tests assert those refusals. A guard
# against SSRF has to name the ranges it blocks, and a test for that guard has to use an address
# inside them — a documentation-range address would pass the guard and prove nothing. Rewriting
# these to silence the scanner would delete the SSRF coverage.
regexes = [
  # Network boundaries enumerated by the SSRF blocklist in modules/http_proxy.py.
  '''10\.0\.0\.0''',
  '''172\.16\.0\.0''',
  '''192\.168\.0\.0''',
  # Addresses inside those ranges, used as must-be-refused fixtures.
  '''10\.0\.0\.1''',
  '''10\.1\.2\.3''',
  '''192\.168\.0\.1''',
  '''192\.168\.1\.1\b''',
  # Loopback and unspecified — bind addresses, not topology.
  '''127\.0\.0\.1''',
  '''127\.0\.0\.2''',
  '''0\.0\.0\.0''',
  # RFC 5737 documentation ranges. Use these for any NEW fixture that needs a routable-looking
  # address; that is what 192.168.1.11 was replaced with.
  '''192\.0\.2\.\d{1,3}''',
  '''198\.51\.100\.\d{1,3}''',
  '''203\.0\.113\.\d{1,3}''',
  '''example\.(com|org|net|invalid)''',
]
paths = [
  '''\.gitleaks\.toml$''',
  # Compiled bytecode. Git-ignored and never committed, but `gitleaks detect --no-git` reads the
  # filesystem rather than the index, so a local scan without this drowns in stale .pyc hits —
  # including values deleted from the source months ago, which read exactly like live findings.
  '''(^|/)__pycache__/''',
  '''\.pyc$''',
  '''(^|/)\.venv/''',
  '''(^|/)\.git/''',
  '''(^|/)dist/''',
]
