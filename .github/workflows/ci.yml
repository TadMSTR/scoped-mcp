name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the workflow level. Nothing in this file writes anything back to the
# repository — it reads the tree, runs tests, and builds a distribution that is never pushed
# anywhere. `contents: read` is the whole requirement, and stating it explicitly is what stops
# the default token scope (which is repository-configurable and has been permissive by default
# on older repos) from silently applying. This is the check that scored searxng-mcp 0/10 on
# OSSF Scorecard's Token-Permissions.
permissions:
  contents: read

# WHICH JOB PROVES WHAT. Two different dependency sets matter, and no single job covers both.
#
#   - The LOCKED set: exactly what uv.lock pins. This is what forge installs (the deploy script
#     installs a hash-pinned `uv export --frozen` of the tag's lock) and what the `audit` job
#     checks for advisories. `test-locked` runs the full suite on that set, on 3.13, forge's
#     Python. Without it, the audited set and the tested set were never the same set.
#   - A FRESH RESOLVE: what `pip install scoped-mcp` gets from PyPI today, inside the ranges in
#     pyproject.toml. The `test` matrix (3.11-3.14) covers that, so an upstream release inside a
#     range that breaks us shows up here before a user reports it.
#
# A green matrix says nothing about the lock, and a green `test-locked` says nothing about
# today's upstream. Keep both.
#
# Every tool that touches the lock or the distribution is pinned: uv by setup-uv's `version:`
# (the same uv forge's deploy script runs, so the two agree on the lock format), pip-audit by
# `--from pip-audit==<x>`, and the build frontend is that same pinned uv (`uv build`).

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          pip install ".[dev,all,otel]"
          pip install aiosqlite respx aiosmtplib

      # agent-bus, test-only: its outbox validator (tests/test_hitl_events.py) and its
      # signature verifier (tests/test_contrib/test_signing_hook_agent_bus.py). It is not in
      # the `dev` extra on purpose: extras are published package metadata, and PyPI refuses
      # a direct git reference there. Pinned by SHA (tags are mutable); this is agent-bus
      # 0.7.1. SCOPED_MCP_REQUIRE_AGENT_BUS below turns its absence into a failure, so
      # neither contract gate can pass by being skipped.
      - name: Install the agent-bus contract validator (test-only)
        run: pip install "agent-bus @ git+https://github.com/TadMSTR/agent-bus@1e3ea4f30445997fd3cddfb8440952e4016474b8"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Run tests
        env:
          SCOPED_MCP_REQUIRE_AGENT_BUS: "1"
        run: pytest --cov=scoped_mcp

  # The suite on the LOCKED dependency set (see the note above `jobs:`). `uv sync --frozen`
  # installs uv.lock exactly and fails rather than re-resolve; the `audit` job's
  # `uv lock --check` is what keeps that lock in step with pyproject.toml.
  test-locked:
    name: Test (locked set, Python 3.13)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"

      - name: Install the locked set
        run: uv sync --frozen --all-extras --python 3.13

      # The same test-only additions as the matrix, none of them in the lock: respx (HTTP
      # mocking) and agent-bus's outbox validator. Installing them must not move anything the
      # lock pinned, or this job would be testing a set nobody deploys; the comparison below
      # fails the job if any locked package changed version or went missing.
      - name: Install test-only tools, then prove the locked set did not move
        run: |
          # pipefail: a failed freeze must not leave an empty locked.txt that compares clean.
          set -o pipefail
          uv pip freeze --exclude-editable | sort > "$RUNNER_TEMP/locked.txt"
          if [ ! -s "$RUNNER_TEMP/locked.txt" ]; then
            echo "::error::uv pip freeze produced no locked set to compare"
            exit 1
          fi
          uv pip install "respx==0.23.1" \
            "agent-bus @ git+https://github.com/TadMSTR/agent-bus@1e3ea4f30445997fd3cddfb8440952e4016474b8"
          uv pip freeze --exclude-editable | sort > "$RUNNER_TEMP/after.txt"
          moved=$(comm -23 "$RUNNER_TEMP/locked.txt" "$RUNNER_TEMP/after.txt")
          if [ -n "$moved" ]; then
            echo "::error::installing test-only tools changed the locked set:"
            echo "$moved"
            exit 1
          fi

      - name: Run tests
        env:
          SCOPED_MCP_REQUIRE_AGENT_BUS: "1"
        run: uv run --no-sync pytest --cov=scoped_mcp

  # WHAT THIS JOB USED TO BE, AND WHY IT WAS NOT AN AUDIT.
  #
  # It was one step: `pip-audit --strict .`. That reads the RANGE specs in pyproject.toml and
  # RE-RESOLVES them, so it reported on "what a fresh install would get today" — never on the
  # set this project actually pins. The distinction is not academic: on the day this job was
  # replaced, the re-resolving form was green while uv.lock carried four known-vulnerable pins
  # (aiosmtplib, cryptography, mcp, pydantic-settings). A gate that is green because it looked
  # somewhere else is worse than no gate, because it is reported as coverage.
  #
  # This is vikunja#670, fleet-wide, and part 2 of this programme fixed the same shape in
  # webhook-doorman. Two gotchas were established there and both apply here:
  #   - `--locked` does NOT read uv.lock. It wants a PEP 751 pylock.toml, which is what
  #     `uv export --format pylock.toml` produces.
  #   - `--strict` trips on the project's own entry, which uv emits as a `directory = {...}`
  #     with no version. `--no-emit-project` is the clean way to leave it out.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"

      # THE GATE THAT MATTERS MOST, AND THE ONE THAT DID NOT EXIST.
      #
      # A committed lockfile with nothing checking its currency is not a pinned dependency set,
      # it is a stale file that looks like one. Measured on this repo when the gate was written:
      # uv.lock was last touched 2026-06-14 and pyproject.toml 2026-08-31, the lock recorded the
      # project itself at v1.3.4 against a real version of 1.14.0, and `asyncpg` — declared in
      # two extras — was absent from the lock entirely. Every check below would have audited a
      # set that was missing a dependency, and passed.
      #
      # The conformance checker's lockfile requirement (F5) tests for the file's PRESENCE. This
      # step is what makes that presence mean something.
      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check

      # Split into two gates rather than one. They fail for different reasons and want different
      # responses: a runtime advisory affects everyone who installs this package from PyPI, a
      # dev-tooling advisory affects only this repository's CI. Collapsing them into a single
      # red would make the urgent case indistinguishable from the routine one.
      #
      # No container gate here — unlike webhook-doorman, this repo publishes no image.
      - name: Export runtime dependency set
        # --all-extras --no-extra dev: every optional dependency a CONSUMER can install
        # (http, smtp, sqlite, otel, dragonfly, postgres, vault, all), and none of the tooling.
        run: |
          uv export --frozen --no-emit-project \
            --all-extras --no-extra dev \
            --format pylock.toml -o pylock.runtime.toml

      - name: Export dev dependency set
        run: |
          uv export --frozen --no-emit-project \
            --extra dev \
            --format pylock.toml -o pylock.dev.toml

      # pip-audit's --locked wants the file named exactly pylock.toml in the project path it is
      # given, so each gate runs in its own directory containing only that file. Auditing from
      # the repo root would let pip-audit see pyproject.toml and fall back to resolving — the
      # exact behaviour this job exists to stop.
      - name: Audit runtime dependencies
        run: |
          mkdir -p .audit-runtime && cp pylock.runtime.toml .audit-runtime/pylock.toml
          uv tool run --from "pip-audit==2.10.1" pip-audit --strict --locked .audit-runtime

      - name: Audit dev dependencies
        run: |
          mkdir -p .audit-dev && cp pylock.dev.toml .audit-dev/pylock.toml
          uv tool run --from "pip-audit==2.10.1" pip-audit --strict --locked .audit-dev

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The build frontend is the pinned uv, not an unpinned `pip install build`. release.yml
      # builds the published artefact the same way, and so does forge's deploy script when it
      # rebuilds the wheel to compare with PyPI's.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      # Same script release.yml runs before it uploads to PyPI. One definition, two call sites
      # — the PR path and the publish path must not be able to drift apart, because the only
      # one that matters is the one nobody watches.
      #
      # This replaces a step that was also called "Verify wheel contents" and did
      # `pip install dist/*.whl` followed by an import. That asserted the wheel was
      # installable. It asserted nothing about contents, which is what its name claimed.
      - name: Verify distribution
        run: .github/ci/verify-dist.sh dist
