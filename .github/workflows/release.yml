name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege at the workflow level. `id-token: write` used to sit here, which handed the
# OIDC-token-minting capability to all three jobs when only `publish-pypi` exchanges it for a
# PyPI trusted-publishing credential. `build` runs `python -m build` on the checked-out tree
# and `create-github-release` runs `gh`; neither has any business minting an identity token for
# this repository. Escalation is now per job, below. This is OSSF Scorecard's Token-Permissions
# check, and it is the same finding that moved searxng-mcp's `packages: write` down a level.
permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  # Between build and publish, deliberately. Before this job existed the release path was
  # build -> upload artifact -> download artifact -> publish, and nothing in it asserted
  # anything about the thing being pushed to PyPI. ci.yml verified the artefact on every PR;
  # the publish path, which is the one that cannot be undone, verified nothing.
  #
  # PyPI does not permit re-uploading a filename. A bad artefact published here is published
  # permanently, and eight agent brokers on forge install this package.
  verify:
    name: Verify distribution
    runs-on: ubuntu-latest
    needs: build

    steps:
      # The repo is checked out for two reasons: the verification script lives here, and it
      # validates examples/manifests/ against the installed wheel. The publish job below needs
      # neither and therefore does not check out.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      # The tag, with its leading `v` stripped, is passed as the expected version. This is the
      # assertion that the publish path needs and the PR path cannot make: the job that
      # publishes is not the job that built, and it trusts a downloaded artifact. Without this,
      # a tag and an artefact that disagree would publish silently.
      - name: Verify distribution against the tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: .github/ci/verify-dist.sh dist "${TAG_NAME#v}"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, verify]
    permissions:
      # The only job that needs it: gh-action-pypi-publish exchanges this OIDC token for a
      # short-lived PyPI credential under the trusted publisher configured below. It is also
      # what makes PyPI attach a PEP 740 attestation to the uploaded files — verified live on
      # v1.14.0, whose provenance endpoint returns a signed in-toto bundle.
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/scoped-mcp/

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # v1.14.2 bumps the bundled Twine to v7. v1.14.0 shipped a Twine that
        # rejects Metadata-Version 2.5 outright ("not a valid metadata version"),
        # which is what current hatchling emits — see the v1.13.0 release failure.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # Trusted publishing — no API token needed in secrets.
        # Requires pending publisher configured at PyPI:
        #   Project: scoped-mcp
        #   Owner: TadMSTR
        #   Repo: scoped-mcp
        #   Workflow: release.yml
        #   Environment: pypi (optional)

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    permissions:
      contents: write  # Required for gh release create

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" &>/dev/null; then
            gh release upload "${TAG_NAME}" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "${TAG_NAME}" \
              dist/*.whl dist/*.tar.gz \
              --title "${TAG_NAME}" \
              --generate-notes \
              --verify-tag
          fi
